[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "journey_analyzer"
version = "1.0"
description = "Similarity analysis of user journeys from event logs"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
viz = ["matplotlib"]
# Stage 3 (semantic). scikit-learn: LDA + HDBSCAN. sentence-transformers: SBERT (pulls torch).
# umap-learn is only needed for the optional UMAP + HDBSCAN route.
semantic = ["scikit-learn>=1.3", "sentence-transformers"]
umap = ["umap-learn"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "matplotlib",
    "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
include = ["journey_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"